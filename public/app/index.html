<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Task Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-startup-image" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="ui.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Share Tech Mono',monospace;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{flex-shrink:0;background:#000;padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #fff}
.app-title{font-family:'Share Tech Mono',monospace;font-size:15px;color:#fff;letter-spacing:0.02em}
.topbar-actions{display:flex;gap:7px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid #fff;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.5}
.icon-btn.plus-btn svg{width:16px;height:16px;stroke-width:2}
.scroll-area{flex:1;overflow-y:auto;background:#000;scrollbar-width:none}
.scroll-area::-webkit-scrollbar{display:none}
.content{padding:16px 18px 24px}
.inbox-input{width:100%;font-family:'Share Tech Mono',monospace;font-size:11px;color:#fff;background:#000;border:1.5px solid #fff;border-radius:10px;padding:10px 12px;resize:none;height:72px;outline:none}
.inbox-input::placeholder{color:#666}
.card{background:#000;border-radius:14px;padding:13px 14px;margin-bottom:8px;overflow:hidden;user-select:none}
.card.dashed{border:1.5px dashed #fff}
.card.dark{background:#fff;border:1.5px solid #fff}
.card.muted{border:1.5px solid #fff}
.card-top{display:flex;align-items:center;gap:12px;cursor:pointer}
.mid{flex:1;min-width:0}
.ctitle{font-family:'Share Tech Mono',monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dashed .ctitle{color:#fff}.dark .ctitle{color:#111}.muted .ctitle{color:#fff}
.csub{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;margin-top:2px}
.dark .csub{color:#111}.muted .csub{color:#fff}
.cright{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bnum{font-family:'Share Tech Mono',monospace;font-size:18px;line-height:1;text-align:right;white-space:nowrap}
.bnum.dkv{color:#111}.bnum.muv{color:#fff}.bnum.fnt{color:#fff}
.nsub{font-family:'Share Tech Mono',monospace;font-size:13px;line-height:16px;letter-spacing:0.06em;text-align:right;margin-top:1px}
.nsub.dlbl{color:#111}.nsub.mlbl{color:#fff}
.ck{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.dark .ck{border:1.5px solid #111;background:transparent}.muted .ck{border:1.5px solid #fff}
.ck svg{width:11px;height:11px;fill:none;stroke-width:2}
.dark .ck svg{stroke:#fff}.muted .ck svg{stroke:#fff}
.ck.ticked{border-color:#111!important;background:#111!important}
.ck.ticked svg{stroke:#fff!important}
.expand-body{border-top:1px solid #fff;margin-top:10px;padding-top:10px;display:none}
.expand-body.open{display:block}
.dark .expand-body{border-top-color:#111}
.habit-note{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;line-height:1.6;margin-bottom:10px}
.dark .habit-note{color:#111}
.yt-link{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#000;border:1px solid #fff;border-radius:8px;text-decoration:none}
.dark .yt-link{background:#fff;border-color:#111}
.yt-icon{width:24px;height:24px;border-radius:5px;background:transparent;border:1px solid #fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dark .yt-icon{background:transparent;border-color:#111}
.yt-icon svg{width:12px;height:12px;fill:#fff}
.dark .yt-icon svg{fill:#111}
.yt-text{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dark .yt-text{color:#111}
.yt-arrow{font-family:'Share Tech Mono',monospace;font-size:10px;color:#fff}
.dark .yt-arrow{color:#111}
.day-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;letter-spacing:0.1em;margin-bottom:8px}
.splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s ease}
.splash.hidden{opacity:0;pointer-events:none}
.splash img{width:60%;max-width:260px;object-fit:contain}
.day-btn{font-family:'Share Tech Mono',monospace;font-size:9px;padding:5px 9px;border-radius:6px;border:1px solid #fff;color:#fff;cursor:pointer;user-select:none;white-space:nowrap}
.day-btn.sel{background:#fff;color:#000;border-color:#fff}
.bolt{width:10px;height:10px;display:inline-block;fill:currentColor}
.hm-block{--g:3px;--gutter:20px;margin-bottom:10px}
.hm-cap{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:0.1em;color:#fff;margin-bottom:8px}
.dark .hm-cap{color:#111}
.hm-wrap{display:flex;gap:6px;align-items:stretch}
.hm-dows{display:flex;flex-direction:column;gap:var(--g);width:calc(var(--gutter) - 6px);flex:0 0 auto}
.hm-dows span{flex:1;display:flex;align-items:center;font-family:'Share Tech Mono',monospace;font-size:8px;color:#fff}
.dark .hm-dows span{color:#111}
.hm{display:flex;gap:var(--g);flex:1;min-width:0}
.hm-col{display:flex;flex-direction:column;gap:var(--g);flex:1;min-width:0}
.hm i{width:100%;aspect-ratio:1;border-radius:2px;display:block}
/* ── TASKS PANES ── */
.tk-content{position:relative;overflow:hidden;flex:1}
.tk-view{position:absolute;inset:0;overflow-y:auto;display:none;scrollbar-width:none}
.tk-view.active{display:block}
.tk-view::-webkit-scrollbar{display:none}
.tkpane .content{padding-bottom:40px}
.pane-pills{display:flex;gap:5px;margin-bottom:14px}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.catinp{font-family:inherit;font-size:9px;padding:5px 9px;border-radius:6px;border:1px solid #fff;background:#000;color:#fff;outline:none;width:96px;flex-shrink:0}
.catinp::placeholder{color:#666}

/* card internals that differ from the habits card, so scoped to the panes */
.tkpane .card-top{align-items:flex-start}
.tkpane .csub{margin-top:3px;letter-spacing:0.06em}
.tkpane .cright{align-items:flex-start;text-align:right}
.tkpane .bnum{text-align:left}
.tkpane .nsub{font-size:9px;line-height:12px;letter-spacing:0.08em;margin-top:0;margin-bottom:4px;text-align:right}
.tkpane .dark .bnum{color:#111}
.tkpane .muted .bnum,.tkpane .dashed .bnum{color:#fff}
.tkpane .dark .nsub{color:#111}
.tkpane .muted .nsub,.tkpane .dashed .nsub{color:#fff}

/* PROGRESS */
.prow{display:flex;align-items:center;gap:9px;margin-top:11px}
.pbar{flex:1;height:3px;border-radius:2px;overflow:hidden;background:#8a8a8a}
.dark .pbar{background:#ccc}
.pbar i{display:block;height:100%;background:#fff}
.dark .pbar i{background:#111}
.pct{font-size:9px;letter-spacing:0.06em;white-space:nowrap}
.dark .pct{color:#111}.muted .pct,.dashed .pct{color:#fff}

/* TASK ROWS — also used inside the project vignette, so global */
.sec-lbl{font-size:8px;letter-spacing:0.1em;color:#fff;margin-bottom:6px}
.dark .sec-lbl{color:#111}
.trow{display:flex;align-items:center;gap:10px;padding:6px 0}
.tck{width:18px;height:18px;border-radius:50%;border:1.5px solid #fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dark .tck{border-color:#111}
.tck svg{width:9px;height:9px;fill:none;stroke-width:2.5;stroke:#000}
.muted .tck.ticked{background:#fff;border-color:#fff}
.dark .tck.ticked{background:#111;border-color:#111}
.dark .tck svg{stroke:#fff}
.tname{font-size:10px;flex:1;min-width:0;color:#fff;line-height:1.35}
.dark .tname{color:#111}
.trow.done .tname{text-decoration:line-through;opacity:0.45}
.tdue{font-size:9px;letter-spacing:0.06em;color:#fff;flex-shrink:0}
.dark .tdue{color:#111}
.tdue.late{border:1px solid #fff;border-radius:4px;padding:1px 5px}
.dark .tdue.late{border-color:#111}
.tacts{display:flex;gap:4px;flex-shrink:0}
.tmv{width:20px;height:20px;border-radius:6px;border:1px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dark .tmv{border-color:#111}
.tmv svg{width:8px;height:8px;fill:none;stroke:#fff;stroke-width:2.5}
.dark .tmv svg{stroke:#111}
.tmv.off{opacity:0.25;pointer-events:none}
.subtog{display:flex;align-items:center;gap:6px;font-size:8px;letter-spacing:0.1em;color:#fff;cursor:pointer;margin-top:10px;padding-top:9px;border-top:1px solid #444}
.dark .subtog{color:#111;border-top-color:#ccc}
.subtog .arw{font-size:9px}
.done-list{display:none;margin-top:4px}
.done-list.open{display:block}
.addrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.addrow .plusdot{width:18px;height:18px;border-radius:50%;border:1.5px dashed #fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;line-height:1}
.dark .addrow .plusdot{border-color:#111;color:#111}
.addinp{flex:1;background:transparent;border:none;outline:none;font-family:inherit;font-size:10px;color:#fff}
.dark .addinp{color:#111}
.addinp::placeholder{color:#777}
.dark .addinp::placeholder{color:#999}
.cardacts{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
.dark .cardacts .icon-btn{border-color:#111;background:#fff}
.dark .cardacts .icon-btn svg{stroke:#111}
.planbtn{font-size:9px;letter-spacing:0.08em;color:#000;background:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;flex-shrink:0}
.pm-tasks{border-top:1px solid #444;margin-top:12px;padding-top:10px}
.pm-tasks .trow{padding:5px 0}
.pm-tasks .tname.pmt{cursor:pointer}
.pm-tasks .addrow{margin-top:5px}
.pm-tasks .sec-lbl.done-lbl{margin-top:12px;padding-top:10px;border-top:1px solid #444}
.empty{font-size:10px;color:#777;padding:18px 0;line-height:1.6}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div class="splash" id="splash"><img src="icons/icon-512.png" alt="Task Manager"></div>

<!-- TOPBAR -->
<div class="topbar" id="topbar">
  <span class="app-title" id="topbar-title">HABITS</span>
  <div class="topbar-actions">
    <div class="icon-btn plus-btn" id="btn-plus" onclick="onPlus()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
  </div>
</div>

<!-- HABITS -->
<div class="tk-content" id="tk-content">

  <!-- PANE 0 - HABITS -->
  <div class="tk-view active" id="tk-habits"><div class="content">
    <div class="day-lbl" id="today-lbl">TODAY — WEDNESDAY</div>
    <div id="habit-list"></div>
  </div></div>

  <!-- PANE 1 - PLANNED -->
  <div class="tk-view tkpane" id="tk-planned"><div class="content">
    <div class="pane-pills">
      <div class="day-btn sel" onclick="goPane(1)">Planned</div>
      <div class="day-btn" onclick="goPane(2)">Backlog</div>
    </div>
    <div class="day-lbl">BY DEADLINE</div>
    <div id="planned-list"></div>
  </div></div>

  <!-- PANE 2 - BACKLOG -->
  <div class="tk-view tkpane" id="tk-backlog"><div class="content">
    <div class="pane-pills">
      <div class="day-btn" onclick="goPane(1)">Planned</div>
      <div class="day-btn sel" onclick="goPane(2)">Backlog</div>
    </div>
    <div class="chips" id="cat-chips"></div>
    <div class="day-lbl">NOT PLANNED YET</div>
    <div id="backlog-list"></div>
  </div></div>

</div>

<script>
/* ── GAS ENDPOINTS ── */
var GAS_HABITS  = 'https://script.google.com/macros/s/AKfycbzQrzuFxhW50uER8S7fNHfQyyEVqtNDngqL1GYXaDLyjlG8wBfGWVJjgff80Dlbclgp/exec';

/* ── STATE ── */
var habits     = [];
var habitsData = null;

/* ── ERROR / LOADING ── */
var MONO="font-family:'Share Tech Mono',monospace;font-size:10px;padding:20px 0";
function setLoading(id){var el=document.getElementById(id);if(el)el.innerHTML='<div style="'+MONO+';color:#ccc">Loading...</div>';}
function setError(id,msg){var el=document.getElementById(id);if(el)el.innerHTML='<div style="'+MONO+';color:#D85A30">'+msg+'</div>';}
function showToast(msg){var t=document.createElement('div');t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:11px;z-index:9999;white-space:nowrap";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},4000);}

/* ── HABIT FORM ── */
var editingHabitIdx=null;
function setNhFreq(freq){
  ['weekly','count','interval'].forEach(function(f){document.getElementById('nf-'+f).classList.toggle('sel',f===freq);});
  document.getElementById('nh-days-section').style.display=freq==='weekly'?'':'none';
  document.getElementById('nh-target-section').style.display=freq==='count'?'':'none';
  document.getElementById('nh-interval-section').style.display=freq==='interval'?'':'none';
}
/* The habit form is the body of the shared Modal shell (see ui.js) — same
   vignette the Tasks screen uses for its project and task settings. */
function habitFormBody(){
  var LBL="font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;margin-bottom:6px;letter-spacing:0.06em";
  return '<input id="nh-name" class="inbox-input" style="height:40px;margin-bottom:6px" placeholder="Habit name...">'+
    '<input id="nh-cat" class="inbox-input" style="height:40px;margin-bottom:8px" placeholder="Category (optional)...">'+
    '<div style="margin-bottom:10px"><div style="'+LBL+'">FREQUENCY</div><div style="display:flex;gap:5px">'+
      '<div class="day-btn sel" id="nf-weekly" onclick="setNhFreq(\'weekly\')">Weekly</div>'+
      '<div class="day-btn" id="nf-count" onclick="setNhFreq(\'count\')">Count</div>'+
      '<div class="day-btn" id="nf-interval" onclick="setNhFreq(\'interval\')">Interval</div></div></div>'+
    '<div id="nh-days-section" style="margin-bottom:10px"><div style="'+LBL+'">DAYS</div>'+
      '<div style="display:flex;gap:5px;flex-wrap:wrap">'+
      ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){
        return '<div class="day-btn" id="nb-'+d+'" onclick="toggleNbDay(\''+d+'\')">'+d+'</div>';
      }).join('')+'</div></div>'+
    '<div id="nh-target-section" style="margin-bottom:10px;display:none"><div style="'+LBL+'">TARGET PER WEEK</div>'+
      '<input id="nh-target" class="inbox-input" type="number" min="1" max="14" style="height:40px" placeholder="e.g. 3"></div>'+
    '<div id="nh-interval-section" style="margin-bottom:10px;display:none"><div style="'+LBL+'">EVERY N DAYS</div>'+
      '<input id="nh-interval" class="inbox-input" type="number" min="1" max="365" style="height:40px" placeholder="e.g. 14"></div>';
}
function openNewHabit(){
  editingHabitIdx=null;
  Modal.open({
    tag:'NEW HABIT',
    body:habitFormBody(),
    save:{label:'Create',fn:submitHabitForm},
    onOpen:function(){
      setNhFreq('weekly');
      setTimeout(function(){document.getElementById('nh-name').focus();},50);
    }
  });
}
function openEditHabit(hi){
  editingHabitIdx=hi;
  var h=habits[hi];
  Modal.open({
    tag:'EDIT HABIT',
    body:habitFormBody(),
    del:{fn:deleteHabit},
    save:{label:'Update',fn:submitHabitForm},
    onOpen:function(){
      document.getElementById('nh-name').value=h.name;
      document.getElementById('nh-cat').value=h.cat||'';
      document.getElementById('nh-target').value=h.target||'';
      document.getElementById('nh-interval').value=h.intervalDays||'';
      (h.days||[]).forEach(function(d){var b=document.getElementById('nb-'+d);if(b)b.classList.add('sel');});
      setNhFreq(h.freq||'weekly');
    }
  });
}
function closeNewHabit(){Modal.close();}
function toggleNbDay(d){document.getElementById('nb-'+d).classList.toggle('sel');}
function buildHabitSub(h){
  if(h.freq==='count'){
    var base=h.cat?h.cat+' · ':'';
    return base+String(h.weekCount||0)+'/'+h.target+' this week';
  }
  if(h.freq==='interval'){
    var base=h.cat||'';
    if(h.today){return base+(base?' · ':'')+' DUE TODAY';}
    if(h.daysUntilDue>0){return base+(base?' · ':'')+'in '+h.daysUntilDue+' days';}
    return base;
  }
  return (h.cat||'')+(h.days&&h.days.length?' · '+h.days.join(' '):'');
}
function deleteHabit(){
  if(editingHabitIdx===null)return;
  var idx=editingHabitIdx;
  var h=habits[idx];
  if(!confirm('Delete "'+h.name+'"? The row stays in the Sheet, marked deleted.'))return;
  var removed=habits.splice(idx,1)[0];
  closeNewHabit();
  renderHabits();updateHabitProgress();
  var revert=function(){habits.splice(idx,0,removed);renderHabits();updateHabitProgress();showToast('Delete failed — please try again');};
  fetch(GAS_HABITS,{method:'POST',body:JSON.stringify({action:'updateActivity',id:removed.id,Status:'deleted'})})
    .then(function(r){return r.json();})
    .then(function(d){if(d&&d.error)revert();})
    .catch(revert);
}
function submitHabitForm(){
  var name=document.getElementById('nh-name').value.trim();
  if(!name)return;
  var cat=document.getElementById('nh-cat').value.trim();
  var freq=['weekly','count','interval'].find(function(f){return document.getElementById('nf-'+f).classList.contains('sel');})||'weekly';
  var days=[];
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){
    if(document.getElementById('nb-'+d).classList.contains('sel'))days.push(d);
  });
  var target=freq==='count'?parseInt(document.getElementById('nh-target').value||'1',10):0;
  var intervalDays=freq==='interval'?parseInt(document.getElementById('nh-interval').value||'7',10):0;
  closeNewHabit();
  var todayAbbr=DAY_ABBR[new Date().getDay()];
  var isToday=freq==='weekly'?days.indexOf(todayAbbr)!==-1:freq==='count'?true:false;
  if(editingHabitIdx!==null){
    var h=habits[editingHabitIdx];
    h.name=name;h.cat=cat;h.freq=freq;h.days=days;h.target=target;h.intervalDays=intervalDays;
    h.today=isToday;h.sub=buildHabitSub(h);
    renderHabits();updateHabitProgress();
    fetch(GAS_HABITS,{method:'POST',body:JSON.stringify({action:'updateActivity',id:h.id,Name:name,Category:cat,Days:days.join(','),Frequency:freq,Target_Per_Week:String(target||''),Interval_Days:String(intervalDays||'')})})
      .then(function(r){return r.json();})
      .catch(function(e){console.error('updateHabit failed',e);});
  }else{
    var tempId='__h'+Date.now();
    var newH={id:tempId,name:name,cat:cat,freq:freq,days:days,target:target,intervalDays:intervalDays,streak:0,credits:0,weekCount:0,daysUntilDue:0,done:false,today:isToday,locked:false,note:'',yt:''};
    newH.sub=buildHabitSub(newH);
    habits.push(newH);
    renderHabits();updateHabitProgress();
    fetch(GAS_HABITS,{method:'POST',body:JSON.stringify({action:'addActivity',Name:name,Category:cat,Days:days.join(','),Frequency:freq,Target_Per_Week:String(target||''),Interval_Days:String(intervalDays||''),Status:'active'})})
      .then(function(r){return r.json();})
      .then(function(d){if(d.success)habits.forEach(function(h){if(h.id===tempId)h.id=String(d.id);});})
      .catch(function(e){console.error('addHabit failed',e);});
  }
}

/* ── HABITS ── */
var DAY_NAMES=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
var DAY_ABBR =['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function buildHabits(data){
  var todayAbbr=DAY_ABBR[new Date().getDay()];
  var todayStr=todayISO();
  var streaks=data.streaks||{};
  var creditsMap=data.credits||{};
  var weekCounts=data.week_counts||{};
  var lastCompleted=data.last_completed||{};
  var logMap={};
  (data.log||[]).forEach(function(r){logMap[r['Activity_ID']+'_'+r['Date']]=String(r['Completed']).toUpperCase()==='TRUE';});
  return (data.activities||[]).filter(function(a){
    return String(a['Status']||'').toLowerCase()!=='deleted';
  }).map(function(a){
    var days=a['Days']?a['Days'].split(',').map(function(d){return d.trim();}).filter(Boolean):[];
    var freq=String(a['Frequency']||'weekly').toLowerCase();
    var target=parseInt(a['Target_Per_Week']||'0',10);
    var intervalDays=parseInt(a['Interval_Days']||'0',10);
    var streak=parseInt(streaks[a['ID']]||'0',10);
    var credits=parseInt(creditsMap[a['ID']]||'0',10);
    var weekCount=parseInt(weekCounts[a['ID']]||'0',10);
    var lc=lastCompleted[a['ID']]||'';
    var done=!!logMap[a['ID']+'_'+todayStr];
    var isToday=false,daysUntilDue=0;
    if(freq==='weekly'){
      isToday=days.indexOf(todayAbbr)!==-1;
    }else if(freq==='count'){
      isToday=done; // dark/TODAY only when done today (or scheduled session — future)
    }else if(freq==='interval'){
      if(!lc){isToday=true;}
      else{
        var lcDate=new Date(lc+'T00:00:00');
        var dueDate=new Date(lcDate);dueDate.setDate(dueDate.getDate()+intervalDays);
        var todayD=new Date();todayD.setHours(0,0,0,0);
        var diff=Math.round((dueDate-todayD)/(1000*60*60*24));
        if(diff<=0){isToday=true;}else{isToday=false;daysUntilDue=diff;}
      }
    }
    var h={
      id:a['ID'],name:a['Name'],cat:a['Category']||'',
      freq:freq,days:days,target:target,intervalDays:intervalDays,
      streak:streak,credits:credits,weekCount:weekCount,daysUntilDue:daysUntilDue,
      done:done,today:isToday,
      locked:String(a['Status']||'').toLowerCase()==='locked',
      note:a['Note']||'',yt:a['YouTube_URL']||''
    };
    h.sub=buildHabitSub(h);

  });
}

function addExtraSession(hi){
  var h=habits[hi];
  h.done=true;h.today=true;
  h.credits++;
  if(h.freq==='count'){h.weekCount++;h.sub=buildHabitSub(h);}
  renderHabits();
  if(habitsData){
    var todStr=todayISO();var found=false;
    (habitsData.log||[]).forEach(function(r){if(String(r['Activity_ID'])===String(h.id)&&r['Date']===todStr){r['Completed']='TRUE';found=true;}});
    if(!found)habitsData.log.push({'Activity_ID':h.id,'Date':todStr,'Completed':'TRUE'});
  }
  updateHabitProgress();
  fetch(GAS_HABITS,{method:'POST',body:JSON.stringify({action:'logActivity',activity_id:h.id,date:todayISO(),completed:true})}).then(function(r){return r.json();}).then(function(d){if(d&&d.error)showToast('Save failed: '+d.error);}).catch(function(){showToast('Extra session not saved — check connection');});
}
function tickHabit(hi){
  var h=habits[hi];
  h.done=!h.done;
  if(h.freq==='count'){
    h.weekCount=Math.max(0,h.weekCount+(h.done?1:-1));
    h.today=h.done;
    h.sub=buildHabitSub(h);
  } else if(h.freq==='weekly'&&h.today){
    h.streak=Math.max(0,h.streak+(h.done?1:-1));
  }
  renderHabits();
  if(habitsData){
    var todStr=todayISO();var found=false;
    (habitsData.log||[]).forEach(function(r){if(String(r['Activity_ID'])===String(h.id)&&r['Date']===todStr){r['Completed']=h.done?'TRUE':'FALSE';found=true;}});
    if(!found&&h.done)habitsData.log.push({'Activity_ID':h.id,'Date':todStr,'Completed':'TRUE'});
  }
  updateHabitProgress();
  fetch(GAS_HABITS,{method:'POST',body:JSON.stringify({action:'logActivity',activity_id:h.id,date:todayISO(),completed:h.done})}).catch(function(){});
}

var GAS_TASKS = 'https://script.google.com/macros/s/AKfycbwO2aFsSlrOcKX6CCnkJf5wAE9kHPY2-LMWnoxz8M5ZB6pawaOEBwmmkFYNetom5Fdr/exec';

var TODAY = todayISO();

/* STATE */
var projects=[], categories=[], catFilter='All', pane=0, animating=false, openIds={}, doneOpenIds={}, curTask=null;

/* ── WRITES ──
   Optimistic throughout: local state changes and re-renders first, the fetch
   goes out behind it, and a failure reverts and tells the user. */
function post(payload,revert,onOk){
  fetch(GAS_TASKS,{method:'POST',body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.error){console.error(payload.action,d.error);if(revert)revert();showToast('Save failed - please try again');}
      else if(onOk)onOk(d);
    })
    .catch(function(){if(revert)revert();showToast('Save failed - check connection');});
}

/* HELPERS */
var MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function isDone(st){return String(st||'').toUpperCase()==='DONE';}
function fmtDue(iso){var p=iso.split('-');return parseInt(p[2],10)+' '+MONTHS[parseInt(p[1],10)-1];}
function daysTo(iso){return Math.round((new Date(iso+'T00:00:00')-new Date(TODAY+'T00:00:00'))/86400000);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* BUILD */
function build(data){
  var byParent={};
  data.tasks.forEach(function(t){(byParent[t.Parent_ID]=byParent[t.Parent_ID]||[]).push(t);});
  return data.projects.map(function(p){
    var ts=byParent[p.ID]||[];
    return {
      id:p.ID, name:p.Name, cat:p.Category||'', due:p.Due_Date||'',
      open:ts.filter(function(t){return !isDone(t.Status);}).map(function(t){return {id:t.ID,name:t.Name,due:t.Due_Date||'',done:false};}),
      done:ts.filter(function(t){return isDone(t.Status);}).map(function(t){return {id:t.ID,name:t.Name,due:t.Due_Date||'',done:true};})
    };
  });
}
function pct(p){var tot=p.open.length+p.done.length;return tot?Math.round(p.done.length/tot*100):0;}

/* RENDER */
var gearSvg='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>';

var upSvg='<svg viewBox="0 0 12 12"><polyline points="2,8 6,3 10,8"/></svg>';

/* INTERACTIONS */
function findP(id){return projects.filter(function(p){return p.id===id;})[0];}
function toggleProject(id){openIds[id]=!openIds[id];renderAll();}
function toggleDone(id){doneOpenIds[id]=!doneOpenIds[id];renderAll();}
function setCat(c){catFilter=c;renderBacklog();renderChips();}

function tickTask(pid,tid){
  var p=findP(pid), nowDone;
  var i=p.open.map(function(t){return t.id;}).indexOf(tid);
  if(i!==-1){var t=p.open.splice(i,1)[0];t.done=true;p.done.unshift(t);nowDone=true;}
  else{
    var j=p.done.map(function(t){return t.id;}).indexOf(tid);
    if(j===-1)return;
    var d=p.done.splice(j,1)[0];d.done=false;p.open.push(d);nowDone=false;
  }
  renderAll();
  post({action:'updateItem',id:tid,Status:nowDone?'DONE':'To Do',Completed_Date:nowDone?todayISO():''},
       function(){tickTask(pid,tid);});   // flipping back is the revert
}
/* renderAll rebuilds the list, so the input the user was in is destroyed.
   Refocus the fresh one to keep typing task after task. */
function addTaskKey(e,pid){
  if(e.key!=='Enter')return;
  var name=e.target.value.trim();
  if(!name)return;
  var p=findP(pid), t={id:'__t'+Date.now(),name:name,due:'',done:false};
  p.open.push(t);
  renderAll();
  var inp=document.getElementById('add-'+pid);
  if(inp)inp.focus();
  createTask(p,t);
}
/* Shared by both add paths: swap the temp id for the real one on success. */
function createTask(p,t){
  post({action:'addItem',Type:'TASK',Parent_ID:p.id,Name:t.name,Category:p.cat,Status:'To Do',Due_Date:t.due||''},
    function(){
      var i=p.open.indexOf(t);
      if(i!==-1)p.open.splice(i,1);
      renderAll();renderPmTasks();
    },
    function(d){if(d&&d.id)t.id=String(d.id);});
}

/* REORDER — lives in the project vignette. Manual order is the list order;
   task deadlines are shown on the row but never re-sort it, otherwise a move
   would not stick. */
var pmOrderDirty=false;
function moveTask(i,dir){
  var j=i+dir;
  if(j<0||j>=pmTasks.length)return;
  pmTasks.splice(j,0,pmTasks.splice(i,1)[0]);
  pmOrderDirty=true;
  renderPmTasks();
  renderAll();
}
/* One reorder call per editing session rather than one per arrow tap. */
function flushOrder(){
  if(!pmOrderDirty||!pmId)return;
  var ids=pmTasks.map(function(t){return t.id;}).filter(function(id){return id.indexOf('__t')!==0;});
  pmOrderDirty=false;
  if(ids.length>1)post({action:'reorderTasks',ids:ids},null);
}

/* TASK DETAIL */
function findT(pid,tid){
  var p=findP(pid);
  return p.open.concat(p.done).filter(function(t){return t.id===tid;})[0];
}
/* Opens from a card row or from the task list inside the project
   vignette — in the second case it stacks on top and the project stays open. */
function openTask(pid,tid){
  curTask={pid:pid,tid:tid};
  var t=findT(pid,tid);
  Modal.open({
    tag:esc(findP(pid).name.toUpperCase()),
    body:'<input id="tm-name" class="ov-inp" placeholder="Task name...">'+
         calField('tm','DEADLINE',t.due||''),
    del:{fn:deleteTaskItem},
    save:{fn:saveTask},
    onOpen:function(){document.getElementById('tm-name').value=t.name;}
  });
}
function closeTask(){curTask=null;Modal.close();renderPmTasks();}
function saveTask(){
  if(!curTask)return;
  var t=findT(curTask.pid,curTask.tid);
  var before={name:t.name,due:t.due};
  var name=document.getElementById('tm-name').value.trim();
  if(name)t.name=name;
  t.due=calValue('tm');
  var id=t.id;
  closeTask();
  renderAll();
  post({action:'updateItem',id:id,Name:t.name,Due_Date:t.due},
       function(){t.name=before.name;t.due=before.due;renderAll();renderPmTasks();});
}
function deleteTaskItem(){
  if(!curTask)return;
  var p=findP(curTask.pid), tid=curTask.tid, removed=null, fromKey, fromIdx;
  ['open','done'].forEach(function(k){
    var i=p[k].map(function(t){return t.id;}).indexOf(tid);
    if(i!==-1){removed=p[k].splice(i,1)[0];fromKey=k;fromIdx=i;}
  });
  closeTask();
  renderAll();
  if(!removed)return;
  post({action:'deleteTask',id:tid},
       function(){p[fromKey].splice(fromIdx,0,removed);renderAll();renderPmTasks();});
}
function planProject(id){openProject(id);}

/* PROJECT VIGNETTE — create (id null) or edit. Uses the shared Modal shell. */
var pmCat='Household', pmId=null, pmTasks=[];
function openNewProject(){openProject(null);}
function openProject(id){
  pmId=id;
  var p=id?findP(id):null;
  pmCat=p?p.cat:(categories[0]?categories[0].Name:'');
  // edit: the live open list, so moves and adds land straight on the project.
  // create: a staging list handed to the project on Create.
  pmTasks=p?p.open:[];
  Modal.open({
    tag:p?'EDIT PROJECT':'NEW PROJECT',
    body:'<input id="pm-name" class="ov-inp" placeholder="Area | title...">'+
         '<div class="ov-lbl">CATEGORY</div><div class="chips" id="pm-cats"></div>'+
         calField('pm','DEADLINE (BLANK = BACKLOG)',p?p.due:'')+
         '<div class="pm-tasks" id="pm-tasks"></div>',
    del:p?{fn:deleteProject}:null,
    save:{label:p?'Save':'Create',fn:saveProject},
    onOpen:function(){
      document.getElementById('pm-name').value=p?p.name:'';
      renderPmCats();
      renderPmTasks();
      if(!p)setTimeout(function(){document.getElementById('pm-name').focus();},50);
    }
  });
}
function renderPmTasks(){
  var el=document.getElementById('pm-tasks');
  if(!el)return;
  var n=pmTasks.length;
  el.innerHTML='<div class="sec-lbl">TASKS ('+n+')</div>'+
    pmTasks.map(function(t,i){
      // a staged task has no saved project to open against yet
      var name=pmId
        ? '<div class="tname pmt" onclick="openTask(\'' + pmId + '\',\'' + t.id + '\')">'+esc(t.name)+'</div>'
        : '<div class="tname">'+esc(t.name)+'</div>';
      return '<div class="trow">'+name+'<div class="tacts">'+
        '<div class="tmv'+(i===0?' off':'')+'" onclick="moveTask('+i+',-1)">'+upSvg+'</div>'+
        '<div class="tmv'+(i===n-1?' off':'')+'" onclick="moveTask('+i+',1)">'+dnSvg+'</div>'+
        '</div></div>';
    }).join('')+
    '<div class="addrow"><input id="pm-add" class="addinp" placeholder="Add a task..." onkeydown="pmAddKey(event)"></div>'+
    pmDoneBlock();
}
/* Completed tasks sit under the add row, struck through and without arrows —
   nothing to reorder, and they are not ticked from here. */
function pmDoneBlock(){
  var done=pmId?findP(pmId).done:[];
  if(!done.length)return '';
  return '<div class="sec-lbl done-lbl">TASKS COMPLETED ('+done.length+')</div>'+
    done.map(function(t){
      return '<div class="trow done"><div class="tname pmt" onclick="openTask(\'' + pmId + '\',\'' + t.id + '\')">'+esc(t.name)+'</div></div>';
    }).join('');
}
/* Enter commits the task and leaves a fresh empty line focused, so a list can
   be typed straight through without reaching for anything. */
function pmAddKey(e){
  if(e.key!=='Enter')return;
  var v=e.target.value.trim();
  if(!v)return;
  var t={id:'__t'+Date.now(),name:v,due:'',done:false};
  pmTasks.push(t);
  renderPmTasks();
  document.getElementById('pm-add').focus();
  // a staged task is written when the project itself is created
  if(pmId){renderAll();createTask(findP(pmId),t);}
}
function renderPmCats(){
  document.getElementById('pm-cats').innerHTML=categories.map(function(c){
    return '<div class="day-btn'+(c.Name===pmCat?' sel':'')+'" onclick="pmCat=\'' + c.Name + '\';renderPmCats()">'+c.Name+'</div>';
  }).join('')+'<div class="day-btn" onclick="pmNewCat()">+</div>';
}
/* The + chip swaps itself for an inline field — no native prompt. */
function pmNewCat(){
  var el=document.getElementById('pm-cats');
  el.insertAdjacentHTML('beforeend','<input id="pm-newcat" class="catinp" placeholder="New..." onkeydown="pmNewCatKey(event)" onblur="pmNewCatCommit()">');
  document.getElementById('pm-newcat').focus();
}
/* Enter is not the only way out of this field — tapping straight into the
   task rows blurs it, and some phone keyboards report the return key as
   keyCode 229 rather than key "Enter". Commit on any of those, and again
   from saveProject, so typed text is never silently dropped. */
function pmNewCatKey(e){
  if(e.key==='Enter'||e.keyCode===13){e.preventDefault();pmNewCatCommit();}
}
function pmNewCatCommit(){
  var el=document.getElementById('pm-newcat');
  if(!el)return;
  var v=el.value.trim();
  if(!v){el.remove();renderPmCats();return;}
  var c={ID:'__c'+Date.now(),Name:v};
  categories.push(c);
  pmCat=v;
  renderPmCats();
  renderChips();
  post({action:'addCategory',name:v},
    function(){
      var i=categories.indexOf(c);
      if(i!==-1)categories.splice(i,1);
      renderPmCats();renderChips();
    },
    function(d){if(d&&d.id)c.ID=String(d.id);});
}
function closeProject(){flushOrder();pmId=null;Modal.close();}
function saveProject(){
  pmNewCatCommit();   // honour a category typed but never confirmed
  var name=document.getElementById('pm-name').value.trim();
  if(!name)return;
  var due=calValue('pm'), editing=pmId, staged=pmTasks;
  if(editing){
    var p=findP(editing);
    var before={name:p.name,cat:p.cat,due:p.due};
    p.name=name;p.cat=pmCat;p.due=due;
    closeProject();
    renderAll();
    goPane(due?1:2);
    post({action:'updateItem',id:p.id,Name:name,Category:pmCat,Due_Date:due},
         function(){p.name=before.name;p.cat=before.cat;p.due=before.due;renderAll();});
  }else{
    var np={id:'__p'+Date.now(),name:name,cat:pmCat,due:due,open:staged,done:[]};
    projects.push(np);
    closeProject();
    renderAll();
    goPane(due?1:2);
    post({action:'addItem',Type:'PROJECT',Name:name,Category:pmCat,Status:'To Do',Due_Date:due},
      function(){
        var i=projects.indexOf(np);
        if(i!==-1)projects.splice(i,1);
        renderAll();
      },
      function(d){
        if(!d||!d.id)return;
        np.id=String(d.id);
        // the staged tasks only get rows once the project has a real id
        staged.forEach(function(t){createTask(np,t);});
      });
  }
}
function deleteProject(){
  if(!pmId)return;
  var p=findP(pmId);
  if(!confirm('Delete "'+p.name+'" and its '+(p.open.length+p.done.length)+' tasks?'))return;
  var idx=projects.indexOf(p), id=p.id;
  projects.splice(idx,1);
  closeProject();
  renderAll();
  post({action:'deleteProject',project_id:id},
       function(){projects.splice(idx,0,p);renderAll();});
}

/* PANE SWIPE */
function slideContent(el,dir,fn){
  if(animating)return;
  animating=true;
  el.style.transition='transform .18s ease, opacity .18s ease';
  el.style.transform='translateX('+(-dir*40)+'px)';
  el.style.opacity='0';
  setTimeout(function(){
    fn();
    el.style.transition='none';
    el.style.transform='translateX('+(dir*40)+'px)';
    requestAnimationFrame(function(){
      el.style.transition='transform .18s ease, opacity .18s ease';
      el.style.transform='translateX(0)';
      el.style.opacity='1';
    });
    setTimeout(function(){animating=false;},200);
  },180);
}
function goPane(next){
  if(next===pane||next<0||next>=PANE_IDS.length||animating)return;
  slideContent(document.getElementById('tk-content'),next>pane?1:-1,function(){
    PANE_IDS.forEach(function(id,i){document.getElementById(id).classList.toggle('active',i===next);});
    document.getElementById('topbar-title').textContent=PANE_TITLE[next];
    pane=next;
  });
}
var sx=0,sy=0;
var tk=document.getElementById('tk-content');
tk.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
tk.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy))return;
  goPane(dx<0?pane+1:pane-1);
},{passive:true});

/* LOAD */
function loadTasks(){
  var MONO="font-family:'Share Tech Mono',monospace;font-size:10px;padding:20px 0";
  document.getElementById('planned-list').innerHTML='<div style="'+MONO+';color:#ccc">Loading...</div>';
  fetch(GAS_TASKS)
    .then(function(r){return r.json();})
    .catch(function(){return{error:'fetch failed'};})
    .then(function(res){
      if(res.error){
        document.getElementById('planned-list').innerHTML='<div style="'+MONO+';color:#D85A30">Tasks unavailable: '+res.error+'</div>';
        return;
      }
      // a Categories row whose Name cell was cleared would render a blank chip
      categories=(res.categories||[]).filter(function(c){return String(c.Name||'').trim();});
      projects=build(res);
      renderAll();
    });
}


/* ── PANES ── 0 habits, 1 planned, 2 backlog on one horizontal axis */
var PANE_IDS   = ['tk-habits','tk-planned','tk-backlog'];
var PANE_TITLE = ['HABITS','TASKS','TASKS'];
function onPlus(){ pane===0 ? openNewHabit() : openNewProject(); }

/* ── INIT ── */
function loadAll(){loadHabits();loadTasks();}
loadAll();
// Remove the service worker + caches left by earlier versions of this app
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
}
if(window.caches){caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k);});});}
</script>
