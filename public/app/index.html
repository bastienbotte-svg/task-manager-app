<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Task Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-startup-image" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Share Tech Mono',monospace;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{flex-shrink:0;background:#000;padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #fff}
.app-title{font-family:'Share Tech Mono',monospace;font-size:15px;color:#fff;letter-spacing:0.02em}
.topbar-actions{display:flex;gap:7px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid #fff;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.5}
.icon-btn.plus-btn svg{width:16px;height:16px;stroke-width:2}
.scroll-area{flex:1;overflow-y:auto;background:#000;scrollbar-width:none}
.scroll-area::-webkit-scrollbar{display:none}
.content{padding:16px 18px 24px}
.inbox-overlay{display:none;position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #fff;padding:14px 18px 18px;z-index:100}
.inbox-overlay.open{display:block}
.inbox-tag{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;letter-spacing:0.08em;margin-bottom:8px}
.inbox-input{width:100%;font-family:'Share Tech Mono',monospace;font-size:11px;color:#fff;background:#000;border:1.5px solid #fff;border-radius:10px;padding:10px 12px;resize:none;height:72px;outline:none}
.inbox-input::placeholder{color:#666}
.inbox-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.inbox-cancel{font-family:'Share Tech Mono',monospace;font-size:10px;color:#fff;cursor:pointer}
.inbox-send{font-family:'Share Tech Mono',monospace;font-size:10px;color:#000;background:#fff;border:none;border-radius:8px;padding:7px 16px;cursor:pointer}
.card{background:#000;border-radius:14px;padding:13px 14px;margin-bottom:8px;overflow:hidden;user-select:none}
.card.dashed{border:1.5px dashed #fff}
.card.dark{background:#fff;border:1.5px solid #fff}
.card.muted{border:1.5px solid #fff}
.card-top{display:flex;align-items:center;gap:12px;cursor:pointer}
.mid{flex:1;min-width:0}
.ctitle{font-family:'Share Tech Mono',monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dashed .ctitle{color:#fff}.dark .ctitle{color:#111}.muted .ctitle{color:#fff}
.csub{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;margin-top:2px}
.dark .csub{color:#111}.muted .csub{color:#fff}
.cright{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bnum{font-family:'Share Tech Mono',monospace;font-size:18px;line-height:1;text-align:right;white-space:nowrap}
.bnum.dkv{color:#111}.bnum.muv{color:#fff}.bnum.fnt{color:#fff}
.nsub{font-family:'Share Tech Mono',monospace;font-size:13px;line-height:16px;letter-spacing:0.06em;text-align:right;margin-top:1px}
.nsub.dlbl{color:#111}.nsub.mlbl{color:#fff}
.ck{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.dark .ck{border:1.5px solid #111;background:transparent}.muted .ck{border:1.5px solid #fff}
.ck svg{width:11px;height:11px;fill:none;stroke-width:2}
.dark .ck svg{stroke:#fff}.muted .ck svg{stroke:#fff}
.ck.ticked{border-color:#111!important;background:#111!important}
.ck.ticked svg{stroke:#fff!important}
.expand-body{border-top:1px solid #fff;margin-top:10px;padding-top:10px;display:none}
.expand-body.open{display:block}
.dark .expand-body{border-top-color:#111}
.habit-note{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;line-height:1.6;margin-bottom:10px}
.dark .habit-note{color:#111}
.yt-link{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#000;border:1px solid #fff;border-radius:8px;text-decoration:none}
.dark .yt-link{background:#fff;border-color:#111}
.yt-icon{width:24px;height:24px;border-radius:5px;background:transparent;border:1px solid #fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dark .yt-icon{background:transparent;border-color:#111}
.yt-icon svg{width:12px;height:12px;fill:#fff}
.dark .yt-icon svg{fill:#111}
.yt-text{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dark .yt-text{color:#111}
.yt-arrow{font-family:'Share Tech Mono',monospace;font-size:10px;color:#fff}
.dark .yt-arrow{color:#111}
.day-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;letter-spacing:0.1em;margin-bottom:8px}
.sec-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;letter-spacing:0.1em;margin:14px 0 8px}
.grid-hdr{display:grid;grid-template-columns:56px repeat(10,1fr);gap:3px;margin-bottom:3px}
.grid-d{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;text-align:center}
.grid-d.tc{color:#fff;text-decoration:underline}
.grid-rw{display:grid;grid-template-columns:56px repeat(10,1fr);gap:3px;margin-bottom:3px;align-items:center}
.grid-act{font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff}
.gc{height:26px;border-radius:4px;background:#1e1e1e;position:relative;display:flex;align-items:center;justify-content:center}
.gc-num{font-family:'Share Tech Mono',monospace;font-size:9px;line-height:1;pointer-events:none}
.gc-cr{position:absolute;top:1px;right:2px;font-family:'Share Tech Mono',monospace;font-size:7px;color:#111;line-height:1;pointer-events:none}
.gc.dn{background:#fff}.gc.dn .gc-num{color:#111}.gc.pl .gc-num{color:#fff}
.gc.ms{background:transparent;border:1px solid #fff}.gc.rs{background:#1e1e1e}
.splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s ease}
.splash.hidden{opacity:0;pointer-events:none}
.splash img{width:60%;max-width:260px;object-fit:contain}
.day-btn{font-family:'Share Tech Mono',monospace;font-size:9px;padding:5px 9px;border-radius:6px;border:1px solid #fff;color:#fff;cursor:pointer;user-select:none}
.day-btn.sel{background:#fff;color:#000;border-color:#fff}
.bolt{width:10px;height:10px;display:inline-block;fill:currentColor}
.hm-block{--c:14px;--g:3px;--gutter:20px;margin-bottom:10px}
.hm-cap{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:0.1em;color:#fff;margin-bottom:8px}
.dark .hm-cap{color:#111}
.hm-wrap{display:flex;gap:6px}
.hm-dows{display:flex;flex-direction:column;gap:var(--g);width:calc(var(--gutter) - 6px)}
.hm-dows span{height:var(--c);line-height:var(--c);font-family:'Share Tech Mono',monospace;font-size:8px;color:#fff}
.dark .hm-dows span{color:#111}
.hm{display:flex;gap:var(--g)}
.hm-col{display:flex;flex-direction:column;gap:var(--g)}
.hm i{width:var(--c);height:var(--c);border-radius:2.5px;display:block;flex:0 0 auto}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div class="splash" id="splash"><img src="icons/icon-512.png" alt="Task Manager"></div>

<!-- TOPBAR -->
<div class="topbar" id="topbar">
  <span class="app-title" id="topbar-title">HABITS</span>
  <div class="topbar-actions">
    <div class="icon-btn plus-btn" id="btn-plus" onclick="openNewHabit()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
  </div>
</div>

<!-- HABITS -->
<div class="scroll-area"><div class="content">
  <div class="day-lbl" id="today-lbl">TODAY — WEDNESDAY</div>
  <div id="habit-list"></div>
  <div class="sec-lbl">CONSISTENCY GRID</div>
  <div class="grid-hdr" id="grid-hdr"><div class="grid-d"></div></div>
  <div id="grid-body"></div>
</div></div>

<!-- NEW / EDIT HABIT OVERLAY -->
<div class="inbox-overlay" id="new-habit-overlay">
  <div class="inbox-tag" id="nh-title">NEW HABIT</div>
  <input id="nh-name" class="inbox-input" style="height:40px;margin-bottom:6px" placeholder="Habit name...">
  <input id="nh-cat" class="inbox-input" style="height:40px;margin-bottom:8px" placeholder="Category (optional)...">
  <div style="margin-bottom:10px">
    <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;margin-bottom:6px;letter-spacing:0.06em">FREQUENCY</div>
    <div style="display:flex;gap:5px">
      <div class="day-btn sel" id="nf-weekly" onclick="setNhFreq('weekly')">Weekly</div>
      <div class="day-btn" id="nf-count" onclick="setNhFreq('count')">Count</div>
      <div class="day-btn" id="nf-interval" onclick="setNhFreq('interval')">Interval</div>
    </div>
  </div>
  <div id="nh-days-section" style="margin-bottom:10px">
    <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;margin-bottom:6px;letter-spacing:0.06em">DAYS</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <div class="day-btn" id="nb-Mon" onclick="toggleNbDay('Mon')">Mon</div>
      <div class="day-btn" id="nb-Tue" onclick="toggleNbDay('Tue')">Tue</div>
      <div class="day-btn" id="nb-Wed" onclick="toggleNbDay('Wed')">Wed</div>
      <div class="day-btn" id="nb-Thu" onclick="toggleNbDay('Thu')">Thu</div>
      <div class="day-btn" id="nb-Fri" onclick="toggleNbDay('Fri')">Fri</div>
      <div class="day-btn" id="nb-Sat" onclick="toggleNbDay('Sat')">Sat</div>
      <div class="day-btn" id="nb-Sun" onclick="toggleNbDay('Sun')">Sun</div>
    </div>
  </div>
  <div id="nh-target-section" style="margin-bottom:10px;display:none">
    <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;margin-bottom:6px;letter-spacing:0.06em">TARGET PER WEEK</div>
    <input id="nh-target" class="inbox-input" type="number" min="1" max="14" style="height:40px" placeholder="e.g. 3">
  </div>
  <div id="nh-interval-section" style="margin-bottom:10px;display:none">
    <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:#fff;margin-bottom:6px;letter-spacing:0.06em">EVERY N DAYS</div>
    <input id="nh-interval" class="inbox-input" type="number" min="1" max="365" style="height:40px" placeholder="e.g. 14">
  </div>
  <div class="inbox-actions">
    <span class="inbox-cancel" onclick="closeNewHabit()">Cancel</span>
    <button class="inbox-send" id="nh-submit" onclick="submitHabitForm()">Create</button>
  </div>
</div>

<script>
/* ── GAS ENDPOINTS ── */
var GAS_HABITS  = 'https://script.google.com/macros/s/AKfycbyMcx_UAJrf2Cv0KGehO5spLEpUndaxG2L9NV5sgWHhvbtHtTJGNqVxX85YfPl1QqZr/exec';

/* ── STATE ── */
var habits     = [];
var habitsData = null;

/* ── ERROR / LOADING ── */
var MONO="font-family:'Share Tech Mono',monospace;font-size:10px;padding:20px 0";
function setLoading(id){var el=document.getElementById(id);if(el)el.innerHTML='<div style="'+MONO+';color:#ccc">Loading...</div>';}
function setError(id,msg){var el=document.getElementById(id);if(el)el.innerHTML='<div style="'+MONO+';color:#D85A30">'+msg+'</div>';}
function showToast(msg){var t=document.createElement('div');t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:11px;z-index:9999;white-space:nowrap";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},4000);}

/* ── HABIT FORM ── */
var editingHabitIdx=null;
function setNhFreq(freq){
  ['weekly','count','interval'].forEach(function(f){document.getElementById('nf-'+f).classList.toggle('sel',f===freq);});
  document.getElementById('nh-days-section').style.display=freq==='weekly'?'':'none';
  document.getElementById('nh-target-section').style.display=freq==='count'?'':'none';
  document.getElementById('nh-interval-section').style.display=freq==='interval'?'':'none';
}
function openNewHabit(){
  editingHabitIdx=null;
  document.getElementById('nh-title').textContent='NEW HABIT';
  document.getElementById('nh-submit').textContent='Create';
  document.getElementById('nh-name').value='';
  document.getElementById('nh-cat').value='';
  document.getElementById('nh-target').value='';
  document.getElementById('nh-interval').value='';
  document.querySelectorAll('#nh-days-section .day-btn').forEach(function(b){b.classList.remove('sel');});
  setNhFreq('weekly');
  document.getElementById('new-habit-overlay').classList.add('open');
  setTimeout(function(){document.getElementById('nh-name').focus();},50);
}
function openEditHabit(hi){
  editingHabitIdx=hi;
  var h=habits[hi];
  document.getElementById('nh-title').textContent='EDIT HABIT';
  document.getElementById('nh-submit').textContent='Update';
  document.getElementById('nh-name').value=h.name;
  document.getElementById('nh-cat').value=h.cat||'';
  document.getElementById('nh-target').value=h.target||'';
  document.getElementById('nh-interval').value=h.intervalDays||'';
  document.querySelectorAll('#nh-days-section .day-btn').forEach(function(b){b.classList.remove('sel');});
  (h.days||[]).forEach(function(d){var btn=document.getElementById('nb-'+d);if(btn)btn.classList.add('sel');});
  setNhFreq(h.freq||'weekly');
  document.getElementById('new-habit-overlay').classList.add('open');
  setTimeout(function(){document.getElementById('nh-name').focus();},50);
}
function closeNewHabit(){document.getElementById('new-habit-overlay').classList.remove('open');}
function toggleNbDay(d){document.getElementById('nb-'+d).classList.toggle('sel');}
function buildHabitSub(h){
  if(h.freq==='count'){
    var base=h.cat?h.cat+' · ':'';
    return base+String(h.weekCount||0)+'/'+h.target+' this week';
  }
  if(h.freq==='interval'){
    var base=h.cat||'';
    if(h.today){return base+(base?' · ':'')+' DUE TODAY';}
    if(h.daysUntilDue>0){return base+(base?' · ':'')+'in '+h.daysUntilDue+' days';}
    return base;
  }
  return (h.cat||'')+(h.days&&h.days.length?' · '+h.days.join(' '):'');
}
function submitHabitForm(){
  var name=document.getElementById('nh-name').value.trim();
  if(!name)return;
  var cat=document.getElementById('nh-cat').value.trim();
  var freq=['weekly','count','interval'].find(function(f){return document.getElementById('nf-'+f).classList.contains('sel');})||'weekly';
  var days=[];
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){
    if(document.getElementById('nb-'+d).classList.contains('sel'))days.push(d);
  });
  var target=freq==='count'?parseInt(document.getElementById('nh-target').value||'1',10):0;
  var intervalDays=freq==='interval'?parseInt(document.getElementById('nh-interval').value||'7',10):0;
  closeNewHabit();
  var todayAbbr=DAY_ABBR[new Date().getDay()];
  var isToday=freq==='weekly'?days.indexOf(todayAbbr)!==-1:freq==='count'?true:false;
  if(editingHabitIdx!==null){
    var h=habits[editingHabitIdx];
    h.name=name;h.cat=cat;h.freq=freq;h.days=days;h.target=target;h.intervalDays=intervalDays;
    h.today=isToday;h.sub=buildHabitSub(h);
    renderHabits();updateHabitProgress();
    fetch(GAS_HABITS,{method:'POST',body:JSON.stringify({action:'updateActivity',id:h.id,Name:name,Category:cat,Days:days.join(','),Frequency:freq,Target_Per_Week:String(target||''),Interval_Days:String(intervalDays||'')})})
      .then(function(r){return r.json();})
      .catch(function(e){console.error('updateHabit failed',e);});
  }else{
    var tempId='__h'+Date.now();
    var newH={id:tempId,name:name,cat:cat,freq:freq,days:days,target:target,intervalDays:intervalDays,streak:0,credits:0,weekCount:0,daysUntilDue:0,done:false,today:isToday,locked:false,note:'',yt:''};
    newH.sub=buildHabitSub(newH);
    habits.push(newH);
    renderHabits();updateHabitProgress();
    fetch(GAS_HABITS,{method:'POST',body:JSON.stringify({action:'addActivity',Name:name,Category:cat,Days:days.join(','),Frequency:freq,Target_Per_Week:String(target||''),Interval_Days:String(intervalDays||''),Status:'active'})})
      .then(function(r){return r.json();})
      .then(function(d){if(d.success)habits.forEach(function(h){if(h.id===tempId)h.id=String(d.id);});})
      .catch(function(e){console.error('addHabit failed',e);});
  }
}

/* ── HABITS ── */
var DAY_NAMES=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
var DAY_ABBR =['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function buildHabits(data){
  var todayAbbr=DAY_ABBR[new Date().getDay()];
  var todayStr=todayISO();
  var streaks=data.streaks||{};
  var creditsMap=data.credits||{};
  var weekCounts=data.week_counts||{};
  var lastCompleted=data.last_completed||{};
  var logMap={};
  (data.log||[]).forEach(function(r){logMap[r['Activity_ID']+'_'+r['Date']]=String(r['Completed']).toUpperCase()==='TRUE';});
  return (data.activities||[]).map(function(a){
    var days=a['Days']?a['Days'].split(',').map(function(d){return d.trim();}).filter(Boolean):[];
    var freq=String(a['Frequency']||'weekly').toLowerCase();
    var target=parseInt(a['Target_Per_Week']||'0',10);
    var intervalDays=parseInt(a['Interval_Days']||'0',10);
    var streak=parseInt(streaks[a['ID']]||'0',10);
    var credits=parseInt(creditsMap[a['ID']]||'0',10);
    var weekCount=parseInt(weekCounts[a['ID']]||'0',10);
    var lc=lastCompleted[a['ID']]||'';
    var done=!!logMap[a['ID']+'_'+todayStr];
    var isToday=false,daysUntilDue=0;
    if(freq==='weekly'){
      isToday=days.indexOf(todayAbbr)!==-1;
    }else if(freq==='count'){
      isToday=done; // dark/TODAY only when done today (or scheduled session — future)
    }else if(freq==='interval'){
      if(!lc){isToday=true;}
      else{
        var lcDate=new Date(lc+'T00:00:00');
        var dueDate=new Date(lcDate);dueDate.setDate(dueDate.getDate()+intervalDays);
        var todayD=new Date();todayD.setHours(0,0,0,0);
        var diff=Math.round((dueDate-todayD)/(1000*60*60*24));
        if(diff<=0){isToday=true;}else{isToday=false;daysUntilDue=diff;}
      }
    }
    var h={
      id:a['ID'],name:a['Name'],cat:a['Category']||'',
      freq:freq,days:days,target:target,intervalDays:intervalDays,
      streak:streak,credits:credits,weekCount:weekCount,daysUntilDue:daysUntilDue,
      done:done,today:isToday,
      locked:String(a['Status']||'').toLowerCase()==='locked',
      note:a['Note']||'',yt:a['YouTube_URL']||''
    };
    h.sub=buildHabitSub(h);
    return h;
  });
}
function renderHabitHeatmap(h){
  if(!habitsData)return '';
  var WEEKS=12;
  var today=new Date();today.setHours(0,0,0,0);
  var logMap={};
  (habitsData.log||[]).forEach(function(r){if(String(r['Activity_ID'])===String(h.id))logMap[r['Date']]=String(r['Completed']).toUpperCase()==='TRUE';});
  // last column is the current week; rows run Mon..Sun
  var end=new Date(today);end.setDate(end.getDate()+(7-today.getDay())%7);
  var onLit=h.today||h.done;
  var ink=onLit?'#111':'#fff', off=onLit?'#e8e8e4':'#1e1e1e';
  var cols='';
  for(var w=WEEKS-1;w>=0;w--){
    cols+='<div class="hm-col">';
    for(var r=0;r<7;r++){
      var d=new Date(end);d.setDate(d.getDate()-w*7-6+r);
      var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      var sched=h.freq==='weekly'&&h.days.indexOf(DAY_ABBR[d.getDay()])!==-1;
      var done=logMap[ds]===true;
      var st;
      if(d>today)    st=sched?'background:transparent;border:1px dashed '+ink:'background:'+off;
      else if(done)  st=(sched||h.freq!=='weekly')?'background:'+ink:'background:'+ink+';clip-path:inset(22% round 1px)';
      else if(sched) st='background:transparent;border:1px solid '+ink;
      else           st='background:'+off;
      cols+='<i style="'+st+'"></i>';
    }
    cols+='</div>';
  }
  return '<div class="hm-block"><div class="hm-cap">LAST '+WEEKS+' WEEKS</div><div class="hm-wrap">'+
    '<div class="hm-dows"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div>'+
    '<div class="hm">'+cols+'</div></div></div>';
}
function renderHabits(){
  var el=document.getElementById('habit-list');el.innerHTML='';
  var comingShown=false;
  habits.sort(function(a,b){if(a.locked!==b.locked)return a.locked?1:-1;if(a.today!==b.today)return a.today?-1:1;return 0;});
  var gearSvg='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>';
  habits.forEach(function(h,hi){
    if(!h.today&&h.freq==='interval'&&h.daysUntilDue>7)return;
    if(h.locked){el.innerHTML+='<div class="card dashed"><div class="card-top"><div class="mid"><div class="ctitle">'+h.name+'</div><div class="csub">'+h.sub+'</div></div><div class="cright"><div><div class="nsub mlbl">UNLOCK AT</div><div class="bnum fnt">15</div></div></div></div></div>';return;}
    if(!h.today&&!comingShown){comingShown=true;el.innerHTML+='<div class="day-lbl" style="margin-top:10px">COMING UP</div>';}
    var isDark=h.today||h.done;
    var cc=isDark?'dark':'muted',nc=isDark?'dkv':'muv',sc=isDark?'dlbl':'mlbl';
    var ck=(h.today||h.freq==='count')?'<div class="ck'+(h.done?' ticked':'')+'" id="hck'+hi+'" onclick="event.stopPropagation();tickHabit('+hi+')">'+(h.done?'<svg viewBox="0 0 14 14"><polyline points="2,7 6,11 12,3"/></svg>':'')+'</div>':'';
    var bufferDiv=h.credits>0?'<div style="text-align:right"><div class="nsub '+sc+'">BUFFER</div><div class="bnum '+nc+'">+'+h.credits+'<svg class="bolt" viewBox="0 0 24 24"><polygon points="13,2 4,14 11,14 10,22 20,9 13,9"/></svg></div></div>':'';
    var rightSide;
    if(h.freq==='count'){
      rightSide=bufferDiv+'<div style="text-align:right"><div class="nsub '+sc+'">THIS WEEK</div><div class="bnum '+nc+'">'+String(h.weekCount).padStart(2,'0')+'/'+h.target+'</div></div>'+ck;
    }else{
      rightSide=bufferDiv+'<div><div class="nsub '+sc+'">STREAK</div><div class="bnum '+nc+'">'+String(h.streak).padStart(2,'0')+'</div></div>'+ck;
    }
    var gear='<div style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px"><div class="icon-btn" onclick="event.stopPropagation();addExtraSession('+hi+')" title="Log extra session"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="icon-btn" onclick="event.stopPropagation();openEditHabit('+hi+')">'+gearSvg+'</div></div>';
    var exp='<div class="expand-body'+(h.today?' open':'')+'" id="heb'+hi+'">'+renderHabitHeatmap(h)+'<div class="habit-note">'+(h.note||'')+'</div>'+(h.yt?'<a class="yt-link" href="'+h.yt+'" target="_blank"><div class="yt-icon"><svg viewBox="0 0 24 24"><path d="M10 8l6 4-6 4V8z"/></svg></div><span class="yt-text">Watch session on YouTube</span><span class="yt-arrow">↗</span></a>':'')+gear+'</div>';
    el.innerHTML+='<div class="card '+cc+'" id="h'+hi+'"><div class="card-top" onclick="document.getElementById(\'heb'+hi+'\').classList.toggle(\'open\')"><div class="mid"><div class="ctitle">'+h.name+'</div><div class="csub">'+h.sub+'</div></div><div class="cright">'+rightSide+'</div></div>'+exp+'</div>';
  });
}
function renderHabitsGrid(data){
  var todayStr=todayISO();
  var DAY2=['Su','Mo','Tu','We','Th','Fr','Sa'];
  // 10-day window: today = index 2 (offset -2..+7)
  var win=[];
  for(var i=-2;i<=7;i++){var d=new Date(todayStr+'T00:00:00');d.setDate(d.getDate()+i);win.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));}
  var logMap={};
  (data.log||[]).forEach(function(r){logMap[r['Activity_ID']+'_'+r['Date']]=String(r['Completed']).toUpperCase()==='TRUE';});
  // Build header dynamically
  var hdr=document.getElementById('grid-hdr');
  hdr.innerHTML='<div class="grid-d"></div>';
  win.forEach(function(dateStr){
    var dow=new Date(dateStr+'T00:00:00').getDay();
    hdr.innerHTML+='<div class="grid-d'+(dateStr===todayStr?' tc':'')+'">'+DAY2[dow]+'</div>';
  });
  // Render rows
  var body=document.getElementById('grid-body');body.innerHTML='';
  var active=(data.activities||[]).filter(function(a){return String(a['Status']||'').toLowerCase()!=='locked';});
  active.forEach(function(a){
    var hObj=habits.find(function(h){return String(h.id)===String(a['ID']);});
    if(!hObj)return;
    var shortName=a['Name'].toLowerCase().substring(0,7);
    var row='<div class="grid-rw"><div class="grid-act">'+shortName+'</div>';
    // Base: strip scheduled+logged days up to and including today so past cells show historical numbers
    var winLoggedSched=0;
    if(hObj.freq==='weekly'){win.forEach(function(ds){if(ds>todayStr)return;var d=new Date(ds+'T00:00:00');if(hObj.days.indexOf(DAY_ABBR[d.getDay()])!==-1&&logMap[a['ID']+'_'+ds]===true)winLoggedSched++;});}
    var projectedStreak=hObj.freq==='weekly'?hObj.streak-winLoggedSched:hObj.streak;
    win.forEach(function(dateStr){
      var isPast=dateStr<todayStr;
      var dow=new Date(dateStr+'T00:00:00').getDay();
      var dowAbbr=DAY_ABBR[dow];
      var logged=logMap[a['ID']+'_'+dateStr]===true;
      var cell;
      if(hObj.freq==='weekly'){
        if(logged){
          var isSched=hObj.days.indexOf(dowAbbr)!==-1;
          if(isSched) projectedStreak++;
          if(isPast&&!isSched){
            cell='<div class="gc dn"></div>'; // past extra: black, no number
          }else{
            var badge=(!isPast&&hObj.credits>0)?'<span class="gc-cr">+'+hObj.credits+'</span>':'';
            cell='<div class="gc dn"><span class="gc-num">'+projectedStreak+'</span>'+badge+'</div>';
          }
        }else{
          var scheduled=hObj.days.indexOf(dowAbbr)!==-1;
          if(!scheduled){cell='<div class="gc rs"></div>';}
          else if(isPast){cell='<div class="gc ms"></div>';}
          else{
            projectedStreak++;
            var badge2=hObj.credits>0?'<span class="gc-cr">+'+hObj.credits+'</span>':'';
            cell='<div class="gc pl"><span class="gc-num">'+projectedStreak+'</span>'+badge2+'</div>';
          }
        }
      }else if(hObj.freq==='count'){
        if(logged){cell='<div class="gc dn"><span class="gc-num">'+hObj.streak+'</span></div>';}
        else{cell='<div class="gc rs"></div>';}
      }else{
        var dueStr='';
        if(hObj.daysUntilDue===0){dueStr=todayStr;}
        else if(hObj.daysUntilDue>0){var dd=new Date(todayStr+'T00:00:00');dd.setDate(dd.getDate()+hObj.daysUntilDue);dueStr=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');}
        if(logged){cell='<div class="gc dn"><span class="gc-num">'+hObj.streak+'</span></div>';}
        else if(dateStr===dueStr){cell='<div class="gc pl"><span class="gc-num">'+(hObj.streak+1)+'</span></div>';}
        else{cell='<div class="gc rs"></div>';}
      }
      row+=cell;
    });
    row+='</div>';
    var tmp=document.createElement('div');tmp.innerHTML=row;body.appendChild(tmp.firstChild);
  });
}
function addExtraSession(hi){
  var h=habits[hi];
  h.done=true;h.today=true;
  h.credits++;
  if(h.freq==='count'){h.weekCount++;h.sub=buildHabitSub(h);}
  renderHabits();
  if(habitsData){
    var todStr=todayISO();var found=false;
    (habitsData.log||[]).forEach(function(r){if(String(r['Activity_ID'])===String(h.id)&&r['Date']===todStr){r['Completed']='TRUE';found=true;}});
    if(!found)habitsData.log.push({'Activity_ID':h.id,'Date':todStr,'Completed':'TRUE'});
    renderHabitsGrid(habitsData);
  }
  updateHabitProgress();
  fetch(GAS_HABITS,{method:'POST',body:JSON.stringify({action:'logActivity',activity_id:h.id,date:todayISO(),completed:true})}).then(function(r){return r.json();}).then(function(d){if(d&&d.error)showToast('Save failed: '+d.error);}).catch(function(){showToast('Extra session not saved — check connection');});
}
function tickHabit(hi){
  var h=habits[hi];
  h.done=!h.done;
  if(h.freq==='count'){
    h.weekCount=Math.max(0,h.weekCount+(h.done?1:-1));
    h.today=h.done;
    h.sub=buildHabitSub(h);
  } else if(h.freq==='weekly'&&h.today){
    h.streak=Math.max(0,h.streak+(h.done?1:-1));
  }
  renderHabits();
  if(habitsData){
    var todStr=todayISO();var found=false;
    (habitsData.log||[]).forEach(function(r){if(String(r['Activity_ID'])===String(h.id)&&r['Date']===todStr){r['Completed']=h.done?'TRUE':'FALSE';found=true;}});
    if(!found&&h.done)habitsData.log.push({'Activity_ID':h.id,'Date':todStr,'Completed':'TRUE'});
    renderHabitsGrid(habitsData);
  }
  updateHabitProgress();
  fetch(GAS_HABITS,{method:'POST',body:JSON.stringify({action:'logActivity',activity_id:h.id,date:todayISO(),completed:h.done})}).catch(function(){});
}
function updateHabitProgress(){}

/* ── LOAD ── */
function loadAll(){
  setLoading('habit-list');
  document.getElementById('today-lbl').textContent='TODAY — '+DAY_NAMES[new Date().getDay()];
  fetch(GAS_HABITS).then(function(r){return r.json();}).catch(function(){return{error:'fetch failed'};})
  .then(function(res){
    if(res.error){setError('habit-list','Habits unavailable: '+res.error);}
    else{
      habitsData=res;
      habits=buildHabits(habitsData);
      renderHabits();
      renderHabitsGrid(habitsData);
      updateHabitProgress();
    }
    // Dismiss splash
    var sp=document.getElementById('splash');
    sp.classList.add('hidden');
    setTimeout(function(){sp.style.display='none';},550);
  });
}

/* ── INIT ── */
loadAll();
// Remove the service worker + caches left by earlier versions of this app
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
}
if(window.caches){caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k);});});}
</script>
